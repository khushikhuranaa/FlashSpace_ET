# FlashSpace cloud deployment (Render + Supabase) — Module 15
#
# The API runs as a long-lived container because the lifecycle worker, signed
# URL streaming and Express middleware need a persistent process. Postgres is
# the production database: REPO_MODE=postgres selects the Postgres data layer,
# and the schema is applied with `npm run db:migrate -w @flashspace/api` before
# the first start (see docs/CLOUD_DEPLOYMENT.md). Storage and Auth are Supabase.

services:
  - type: web
    name: flashspace-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: TRUST_PROXY
        value: 1
      - key: REQUIRE_HTTPS
        value: true
      - key: AUTH_MODE
        value: supabase
      - key: REPO_MODE
        value: postgres
      # Apply pending migrations on boot; the runner holds a Postgres advisory
      # lock, so multiple instances cannot race.
      - key: RUN_MIGRATIONS_ON_BOOT
        value: "true"
      - key: STORAGE_MODE
        value: supabase
      - key: WEB_ORIGIN
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AVATARS_BUCKET
        value: avatars
      - key: SUPABASE_FILES_BUCKET
        value: space-files
      - key: SUPABASE_VAULT_BUCKET
        value: vault-archives
      - key: SUPABASE_TEMP_BUCKET
        value: archive-temp
      - key: LOCAL_AUTH_SECRET
        generateValue: true
      - key: JOB_SECRET
        generateValue: true
      # Transactional mail is mocked until an SMTP provider is configured; auth
      # email (sign-up, recovery) is sent by Supabase, not by this service. To
      # enable real mail later, add SMTP_HOST, SMTP_PORT, SMTP_USER,
      # SMTP_PASSWORD and SMTP_FROM in the dashboard and set this to smtp.
      - key: EMAIL_TRANSPORT
        value: mock

  # The frontend is not hosted here: .github/workflows/deploy-web-pages.yml
  # publishes the static Vite bundle to GitHub Pages. This API must allow that
  # origin in WEB_ORIGIN (e.g. https://<owner>.github.io) or browser calls fail
  # the CORS check.

  # Scheduler: deliberately no Render cron service — cron instances are a paid
  # plan, and adding one puts this blueprint behind a payment method. The same
  # authenticated, idempotent endpoint runs for free from GitHub Actions
  # (.github/workflows/lifecycle-cron.yml); after the first deploy, set its
  # FLASHSPACE_API_URL and FLASHSPACE_JOB_SECRET repository secrets.
